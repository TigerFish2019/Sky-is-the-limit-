<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hoogtepunt</title>
<meta name="theme-color" content="#121c26">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:16px/1.5 system-ui,Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: één kolom berglogboek op telefoonbreedte, vaste tabbalk onderin. Leisteen-avond met een oranje zonsopkomst als accent; hoogtelijnen op de achtergrond. */
:root{
  --void:#121c26;
  --panel:#1a2632;
  --panel-2:#22303e;
  --line:#ff9f5a;
  --line-dim:#3b4c5c;
  --ink:#f1f4f6;
  --muted:#a3b0bc;
  --gold:#ffd27a;
  --violet:#b9a3ff;
  --red:#ff6f6f;
  --ok:#62dca0;
  --cat-beweging:#ff9f5a;
  --cat-community:#62dca0;
  --cat-interactie:#ff9cc0;
  --cat-mindfulness:#c2adff;
  --f-sys:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 55% at 50% -12%,rgba(255,159,90,.20),transparent 62%),repeating-radial-gradient(ellipse at 15% 115%,transparent 0 26px,rgba(255,255,255,.035) 26px 27px),repeating-radial-gradient(ellipse at 95% -10%,transparent 0 34px,rgba(255,255,255,.025) 34px 35px);background-attachment:fixed;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--void)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button{position:relative;overflow:hidden}
button::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .25s;pointer-events:none}
button:active::after{opacity:.12;transition:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

/* Systeemvenster */
.win{position:relative;border-radius:16px;background:linear-gradient(180deg,rgba(34,48,62,.92),rgba(26,38,50,.92));border:1px solid var(--line-dim);box-shadow:0 0 0 1px rgba(255,159,90,.08) inset,0 0 24px rgba(255,159,90,.12);padding:14px}
.win::before,.win::after{content:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.sys-label{font-family:var(--f-sys);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--line)}
h1,h2,h3{font-family:var(--f-sys);margin:0;text-wrap:balance;letter-spacing:.04em}
h2{font-size:20px}
.muted{color:var(--muted)}

/* Header */
.hud{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.rank-badge{border-radius:10px;width:54px;height:54px;display:grid;place-items:center;font-family:var(--f-sys);font-weight:700;font-size:28px;color:var(--rank,var(--line));border:2px solid var(--rank,var(--line));transform:rotate(45deg);box-shadow:0 0 16px var(--rank,var(--line)) inset,0 0 12px color-mix(in srgb,var(--rank,var(--line)) 50%,transparent)}
.rank-badge span{transform:rotate(-45deg);text-shadow:0 0 10px var(--rank,var(--line))}
.hud-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-name{font-family:var(--f-sys);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-lvl{font-family:var(--f-sys);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hud-lvl b{color:var(--ink);font-size:18px}
.bar{height:8px;background:#16212c;border:1px solid var(--line-dim);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e0703a,var(--line));box-shadow:0 0 10px var(--line);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hud-sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.streak{color:var(--gold)}

/* Quests */
.today-head{display:flex;justify-content:space-between;align-items:end;gap:10px}
.today-head h2{font-size:22px}
.timer{font-family:var(--f-sys);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.timer b{display:block;color:var(--red);font-size:16px}
.notice{border-color:rgba(255,77,106,.5);box-shadow:0 0 22px rgba(255,77,106,.15)}
.notice .sys-label{color:var(--red)}
.qlist{display:flex;flex-direction:column;gap:10px}
.q{--c:var(--line);border-radius:14px;position:relative;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;padding:12px 12px 12px 14px;background:rgba(26,38,50,.85);border:1px solid #33475a;transition:border-color .2s,box-shadow .2s,transform .15s}
.q[data-cat="community"]{--c:var(--cat-community)}
.q[data-cat="interactie"]{--c:var(--cat-interactie)}
.q[data-cat="mindfulness"]{--c:var(--cat-mindfulness)}
.q::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--c);box-shadow:0 0 8px var(--c)}
button.q:active{transform:scale(.985)}
.q.sel{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent),0 0 0 1px var(--c) inset}
.q.hidden-q{border-color:rgba(255,207,92,.6);background:linear-gradient(135deg,rgba(255,207,92,.08),rgba(26,38,50,.9) 50%)}
.q.done{opacity:.62}
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-sys);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.q-cat{color:var(--c)}
.q-stat{color:var(--muted)}
.q-xp{margin-left:auto;color:var(--gold);font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.q-text{font-size:16px;font-weight:500;line-height:1.35}
.q-hint{font-size:13px;color:var(--muted)}
.q-check{position:absolute;right:10px;bottom:10px;width:22px;height:22px;border:1.5px solid var(--line-dim);display:grid;place-items:center;font-family:var(--f-sys);font-size:14px;color:var(--void)}
.q.sel .q-check{background:var(--c);border-color:var(--c)}
.hidden-tag{color:var(--gold)}
.counter{display:flex;flex-direction:column;gap:8px}
.counter-row{display:flex;align-items:center;gap:6px}
.count-num{font-family:var(--f-sys);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:0;flex:1}
.count-num small{font-size:13px;color:var(--muted)}
.cbtn{min-width:44px;height:40px;padding:0 10px;border:1px solid var(--line-dim);background:var(--panel-2);font-family:var(--f-sys);font-weight:600;font-size:14px}
.cbtn:active{background:#3a4f63}
.cbar i{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 50%,#000),var(--c));box-shadow:0 0 10px var(--c)}
.btn{border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;font-family:var(--f-sys);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink);background:linear-gradient(180deg,rgba(255,159,90,.22),rgba(255,159,90,.06));box-shadow:0 0 16px rgba(255,159,90,.25)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.ghost{border-color:var(--line-dim);background:transparent;box-shadow:none;font-size:13px;min-height:42px}
.btn.gold{border-color:var(--gold);color:var(--gold);background:linear-gradient(180deg,rgba(255,207,92,.18),rgba(255,207,92,.04));box-shadow:0 0 16px rgba(255,207,92,.25)}
.btn.danger{border-color:var(--red);color:var(--red);background:transparent;box-shadow:none}
.btn-done{min-height:42px;font-size:13px}
.actions{display:flex;gap:10px}
.actions>*{flex:1}
.choose-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(18,28,38,.9);backdrop-filter:blur(8px);border:1px solid var(--line-dim)}
.choose-bar .row{display:flex;justify-content:space-between;font-family:var(--f-sys);font-size:13px;color:var(--muted);letter-spacing:.08em}
.complete-banner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.complete-banner h2{color:var(--ok);text-shadow:0 0 14px rgba(77,255,184,.5)}

/* Hunter */
.avatar-wrap{position:relative;display:grid;place-items:center;padding-block:4px}
.avatar-wrap svg{width:100%;max-width:300px;height:auto;overflow:hidden;border-radius:14px}
.evo-step svg{overflow:hidden;border-radius:4px}
.avatar-caption{text-align:center;display:flex;flex-direction:column;gap:2px}
.avatar-caption h2{font-size:22px}
.title-chip{display:inline-block;font-family:var(--f-sys);font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:grid;grid-template-columns:96px 1fr 38px 40px;gap:8px;align-items:center}
.stat-name{font-family:var(--f-sys);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.stat-name small{display:block;font-family:var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);font-size:11px}
.stat-val{font-family:var(--f-sys);font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.plus{width:40px;height:34px;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-sys);font-size:18px}
.plus:disabled{opacity:.15;border-color:var(--line-dim);color:var(--muted)}
.free{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-sys);font-size:13px;letter-spacing:.1em}
.free b{color:var(--gold);font-size:18px}
.unlocks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.unlocks li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px}
.unlocks .r{font-family:var(--f-sys);font-weight:700;text-align:center;border:1px solid currentColor;padding:1px 0}
.unlocks li.got{color:var(--ink)}
.unlocks li.lock{color:#6c7d8d}
.titles{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-family:var(--f-sys);font-size:12px;letter-spacing:.08em;padding:6px 9px;border:1px solid var(--line-dim);color:#6c7d8d}
.tchip.on{border-color:var(--gold);color:var(--gold)}
.tchip.active{background:rgba(255,207,92,.15)}

/* Logboek */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis-4{grid-template-columns:repeat(2,1fr)}
.kpi{display:flex;flex-direction:column;gap:2px;padding:10px;border:1px solid #33475a;background:rgba(26,38,50,.7)}
.kpi b{font-family:var(--f-sys);font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;max-width:100%;border:1px solid #33475a;background:#16212c}
.day.p1{background:rgba(255,159,90,.25)}
.day.p2{background:rgba(255,159,90,.5)}
.day.p3{background:var(--line);box-shadow:0 0 8px var(--line)}
.day.today{outline:1px solid var(--gold);outline-offset:1px}
.log{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid #2a3a4a;font-size:14px}
.log li:last-child{border-bottom:0}
.log .dot{width:8px;height:8px;align-self:center}
.log .x{font-family:var(--f-sys);color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px}
.log .d{display:block;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-sys);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:#16212c;border:1px solid var(--line-dim);padding:10px 12px;border-radius:0}
textarea{min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input:focus,textarea:focus{outline:none;border-color:var(--line);box-shadow:0 0 10px rgba(255,159,90,.3)}
.stack{display:flex;flex-direction:column;gap:12px}
.small{font-size:13px}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gate{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:14px;border:2px solid var(--line);overflow:hidden;background:#16212c;box-shadow:0 0 18px rgba(255,159,90,.4),inset 0 0 22px rgba(255,159,90,.5);transition:transform .15s}
.gate-core{position:absolute;inset:-35%;background:conic-gradient(from 0deg,#2a3a4a,#ff9f5a,#ffd27a,#7cc8ff,#3b4c5c,#2a3a4a);filter:blur(7px);animation:spin 5s linear infinite;opacity:.9}
.gate::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 58%,rgba(255,255,255,.6),transparent 38%)}
.gate-lbl{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-family:var(--f-sys);font-weight:700;font-size:30px;color:#fff;text-shadow:0 0 12px var(--line)}
button.gate:active{transform:scale(.95)}
.gate.closed{border-style:dashed;border-color:var(--line-dim);box-shadow:none;opacity:.55}
.gate.closed .gate-lbl{font-size:20px;text-shadow:none}
.gate-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-family:var(--f-sys);letter-spacing:.06em}
.gate-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:50%;vertical-align:-1px}
.gate-q{border-color:var(--c);box-shadow:0 0 20px color-mix(in srgb,var(--c) 35%,transparent)}
.gate-timer{font-family:var(--f-sys);font-size:13px;color:var(--red);letter-spacing:.06em}
.gate-timer b{font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.seg button{min-height:40px;border:1px solid var(--line-dim);font-family:var(--f-sys);font-size:13px;letter-spacing:.06em;color:var(--muted)}
.seg button.on{border-color:var(--line);color:var(--ink);background:rgba(255,159,90,.18);box-shadow:0 0 10px rgba(255,159,90,.25)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

/* Tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(18,28,38,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line-dim)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:480px;gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-family:var(--f-sys);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab[aria-selected="true"]{color:var(--line);text-shadow:0 0 8px var(--line)}
.tab[aria-selected="true"] svg{filter:drop-shadow(0 0 4px var(--line))}
.dotbadge{position:relative}
.dotbadge[data-n]::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;min-width:16px;height:16px;padding:0 4px;background:var(--gold);color:var(--void);font-size:10px;line-height:16px;letter-spacing:0;border-radius:8px}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(2,4,9,.78);backdrop-filter:blur(4px)}
.overlay .win{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.overlay .big{font-family:var(--f-sys);font-weight:700;font-size:44px;line-height:1;color:var(--line);text-shadow:0 0 18px var(--line)}
.overlay .big.gold{color:var(--gold);text-shadow:0 0 18px var(--gold)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;font-family:var(--f-sys);font-size:14px;letter-spacing:.06em;padding:10px 16px;border:1px solid var(--gold);color:var(--gold);background:rgba(18,28,38,.95);box-shadow:0 0 16px rgba(255,207,92,.3);max-width:calc(100% - 32px);text-align:center}

/* Avatar animatie */
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes flicker{0%,100%{opacity:.75;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.05)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
.av-body{animation:breathe 4s ease-in-out infinite;transform-box:fill-box}
.av-orbit{transform-origin:120px 200px;animation:orbit 14s linear infinite}
.av-spark{animation:twinkle 2.4s ease-in-out infinite}
.av-flame{transform-origin:120px 300px;animation:flicker 1.6s ease-in-out infinite}
.av-flame2{animation-duration:1.1s}
.av-bob{animation:bob 3s ease-in-out infinite}
.av-flag{animation:flag 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.av-flick{animation:pulse 1.2s ease-in-out infinite}
.av-rise{animation:rise 3.4s ease-in infinite;transform-box:fill-box}
.av-rise.slow{animation-duration:6s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.evo{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.evo-step{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border:1px solid #33475a;background:#16212c;font-family:var(--f-sys);font-weight:700;font-size:12px;color:var(--muted)}
.evo-step svg{width:100%;height:auto}
.evo-step.on{border-color:var(--line);color:var(--ink);box-shadow:0 0 10px rgba(255,159,90,.3)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:40px;padding:0 12px;border:1px solid var(--line-dim);font-family:var(--f-sys);font-size:13px;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:7px}
.opt.on{border-color:var(--line);color:var(--ink);background:rgba(255,159,90,.16);box-shadow:0 0 10px rgba(255,159,90,.25)}
.opt i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 6px currentColor}
.swatch{width:40px;height:40px;border:2px solid #33475a;border-radius:50%}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--line),0 0 12px var(--line)}
.evo-label{margin:0;text-align:center;font-size:13px}
.av-aura{animation:pulse 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app"></div>
<nav class="tabs" aria-label="Navigatie">

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n));};
function hash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const needXp=l=>80+20*l;
const rankIdx=l=>{let i=0;RANKS.forEach((r,j)=>{if(l>=r.min)i=j;});return i;};
const tierOf=l=>Math.min(3,rankIdx(l));
const fmt=n=>n.toLocaleString("nl-NL");

function migrate(o){o.stats=Object.assign({STR:10,VIT:10,AGI:10,CHA:10,RUS:10,VER:10},o.stats||{});o.counts=Object.assign({beweging:0,community:0,interactie:0,mindfulness:0},o.counts||{});o.settings=Object.assign({penalty:false,office:null},o.settings||{});return o;}

/* ===================== DAGLOGICA ===================== */
function genOffer(date,salt){
  const r=rng(hash(date+"|"+S.name+"|"+salt));
  const recent=new Set();S.history.slice(-12).forEach(h=>h.ids.forEach(i=>recent.add(i)));
  const tier=tierOf(S.level);
  const [yy,mm,dd]=date.split("-").map(Number);const office=S.settings.office!=null&&new Date(yy,mm-1,dd).getDay()===S.settings.office;
  const okDay=q=>!q.o||office;
  const pick=(cat,k,only)=>{const base=POOL.filter(q=>q.cat===cat&&okDay(q)&&(!only||q.o));let c=base.filter(q=>!recent.has(q.id));if(c.length<k)c=base.slice();
    const out=[];while(out.length<k&&c.length){out.push(c.splice(Math.floor(r()*c.length),1)[0]);}return out;};
  // Kantoordag: één interactiequest is gegarandeerd een kantoorquest
  const offI=office?pick(I,1,true):[];offI.forEach(q=>recent.add(q.id));
  const ci=r()<.5;const tpls=[...pick(B,2),...pick(M,2),...pick(C,ci?2:1),...offI,...pick(I,Math.max(0,(ci?1:2)-offI.length))];
  // schudden
  for(let i=tpls.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[tpls[i],tpls[j]]=[tpls[j],tpls[i]];}
  const hiddenAt=r()<0.14?Math.floor(r()*7):-1;
  return tpls.map((t,i)=>{
    let n=t.n?t.n[tier]:null, text=t.t.replace(/\{n\}/g,n!=null?fmt(n):"");
    let mod=null;
    if(t.cat===B&&t.c&&r()<0.4){mod=MODS[Math.floor(r()*MODS.length)];text+=" "+mod;}
    let xp=BASEXP[t.cat]*(1+0.15*tier)*(mod?1.15:1)*(t.n?1:1.05);
    const hidden=i===hiddenAt; if(hidden)xp*=2;
    const target=t.c?n*t.c:null;
    return{id:t.id,cat:t.cat,s:t.s,text,h:t.h||null,xp:Math.round(xp/5)*5,target,step:t.step||null,hidden,u:t.u||null};
  });
}
function ensureDay(){
  const k=dkey();
  if(S.today&&S.today.date===k)return false;
  if(S.today){ // vorige dag afsluiten
    const t=S.today;const done=t.chosen.filter(i=>t.done[i]).length;
    if(t.chosen.length)S.history.push({d:t.date,ids:t.chosen.map(i=>t.offer[i].id),done});
    S.history=S.history.slice(-60);
  }
  const yest=addDays(k,-1);
  const missed=S.lastPerfect!==yest&&S.lastPerfect!==k&&(S.streak>0||(S.today&&!S.today.perfect));
  if(missed){
    if(S.settings.penalty){
      const loss=Math.floor(S.xp*0.25);S.xp-=loss;
      const r=rng(hash(k+"straf"));
      S.penalty={mode:"hard",lost:S.streak,loss,date:k,quest:PENALTY[Math.floor(r()*PENALTY.length)],done:false,confirm:false};
      S.streak=0;
    }else if(S.streak>0){
      S.penalty={mode:"soft",lost:S.streak,date:k,done:true};
    }
  }
  S.today={date:k,offer:genOffer(k,0),sel:[],chosen:[],prog:{},done:{},rerolled:false,perfect:false,confirm:null};
  save();return true;
}

/* ===================== XP & LEVELS ===================== */
let queue=[];
function gainXp(x){
  S.xp+=x;S.totalXp+=x;
  const before=rankIdx(S.level);
  while(S.xp>=needXp(S.level)){S.xp-=needXp(S.level);S.level++;S.free+=3;queue.push({type:"level",level:S.level});}
  const after=rankIdx(S.level);if(after>before)queue.push({type:"rank",r:after});
}
function checkTitles(){TITLES.forEach(t=>{if(!S.titles.includes(t.id)&&t.ok(S)){S.titles.push(t.id);queue.push({type:"title",t});if(!S.activeTitle)S.activeTitle=t.id;}});}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function streakMult(){return 1+Math.min(S.streak,10)*0.05;}
function complete(i){
  const t=S.today;if(t.done[i])return;
  const q=t.offer[i];t.done[i]=true;buzz(40);
  const x=Math.round(q.xp*streakMult());
  S.stats[q.s]+=q.hidden?2:1;
  S.counts[q.cat]++;S.totalDone++;if(q.hidden)S.hiddenDone++;
  S.recent.unshift({d:t.date,text:q.text,xp:x,cat:q.cat});S.recent=S.recent.slice(0,40);
  toast("+"+x+" XP · +"+(q.hidden?2:1)+" "+STATS.find(s=>s.k===q.s).n);
  gainXp(x);
  checkPerfect();
  checkTitles();save();render();flush();
}
function penaltyOpen(){return S.penalty&&S.penalty.mode==="hard"&&!S.penalty.done&&S.penalty.date===S.today.date;}
function checkPerfect(){
  const t=S.today;
  if(t.perfect||t.chosen.length!==3||!t.chosen.every(c=>t.done[c]))return;
  if(penaltyOpen()){toast("Rond eerst de strafquest af voor je dagbonus");return;}
  t.perfect=true;
  const cont=S.lastPerfect===addDays(t.date,-1)||(!S.settings.penalty&&S.streak>0);
  S.streak=cont?S.streak+1:1;
  S.lastPerfect=t.date;S.best=Math.max(S.best,S.streak);S.perfectDays++;
  const bonus=50+10*Math.min(S.streak,10);
  gateState().keys+=1;
  queue.push({type:"daily",bonus});gainXp(bonus);
}

/* ===================== POORTEN ===================== */
// Na de 3 dagquests krijg je een poortsleutel. Elke gezuiverde poort geeft een nieuwe sleutel: je kunt eindeloos door.
const GATES={
 blauw:{n:"Groene route",c:"#62dca0",m:1,d:"Een rustige extra route met een extra quest."},
 paars:{n:"Blauwe route",c:"#7cc8ff",m:1.6,d:"Pittiger. Meer XP."},
 rood:{n:"Zwarte route",c:"#f1f4f6",m:2.5,d:"Zwaar en snel: je hebt 2 uur, anders trekt de mist dicht en verlies je je reeks."}
};
function gateState(){const t=S.today;if(!t.gate)t.gate={keys:0,combo:0,best:0,cleared:0,active:null,seed:0,used:[]};return t.gate;}
function gateMult(){return 1+0.1*Math.min(gateState().combo,10);}
function isOfficeDay(date){const [y,m,d]=date.split("-").map(Number);return S.settings.office!=null&&new Date(y,m-1,d).getDay()===S.settings.office;}
function openGate(slot){
  const t=S.today,G=gateState();if(!G.keys||G.active)return;
  G.seed++;const r=rng(hash(t.date+"|poort|"+G.seed+"|"+slot+"|"+S.name));
  const red=Math.min(.08+G.combo*.04,.3),pur=Math.min(.25+G.combo*.05,.45),x=r();
  const rar=x<red?"rood":x<red+pur?"paars":"blauw";
  const cat=rar==="rood"&&r()<.6?B:[B,C,I,M][Math.floor(r()*4)];
  const used=new Set([...t.offer.map(q=>q.id),...G.used]),office=isOfficeDay(t.date);
  let c=POOL.filter(q=>q.cat===cat&&!used.has(q.id)&&(!q.o||office));if(!c.length)c=POOL.filter(q=>q.cat===cat&&!q.o);
  const tp=c[Math.floor(r()*c.length)],base=tierOf(S.level),tier=Math.min(3,base+(rar==="blauw"?0:1));
  let n=tp.n?tp.n[tier]:null;if(rar==="rood"&&n&&base>=3)n=Math.round(n*1.25);
  const text=tp.t.replace(/\{n\}/g,n!=null?fmt(n):"");
  const xp=Math.round(BASEXP[tp.cat]*(1+0.15*base)*GATES[rar].m/5)*5;
  G.used.push(tp.id);G.keys--;buzz([30,60,30]);
  G.active={id:tp.id,cat:tp.cat,s:tp.s,text,h:tp.h||null,xp,target:tp.c?n*tp.c:null,step:tp.step||null,rar,prog:0,confirm:false,deadline:rar==="rood"?Date.now()+2*3600e3:null};
  queue.push({type:"gate",rar});save();render();flush();
}
function clearGate(){
  const G=gateState(),q=G.active;if(!q)return;buzz([40,40,80]);
  const x=Math.round(q.xp*gateMult()*streakMult()),pts=q.rar==="rood"?2:1;
  S.stats[q.s]+=pts;S.counts[q.cat]++;S.totalDone++;
  S.gatesCleared=(S.gatesCleared||0)+1;if(q.rar==="rood")S.redCleared=(S.redCleared||0)+1;
  G.combo++;G.best=Math.max(G.best,G.combo);G.cleared++;G.keys++;G.active=null;S.bestCombo=Math.max(S.bestCombo||0,G.combo);
  S.recent.unshift({d:S.today.date,text:q.text,xp:x,cat:q.cat});S.recent=S.recent.slice(0,40);
  queue.push({type:"cleared",rar:q.rar,x,combo:G.combo});gainXp(x);
  checkTitles();save();render();flush();
}
function abandonGate(why){const G=gateState();if(!G.active)return;G.active=null;G.combo=0;G.keys++;save();render();toast(why==="tijd"?"De mist trok dicht op de zwarte route. Je reeks is weg.":"Route gestopt. Je reeks staat weer op 0.");}
function gateTimeLeft(q){const s=Math.max(0,(q.deadline-Date.now())/1000|0);return pad(s/3600|0)+":"+pad((s%3600)/60|0)+":"+pad(s%60);}
function gatesView(){
  const t=S.today;
  if(!t.perfect)return `<section class="win stack gate-locked"><span class="sys-label">Extra routes · op slot</span><div class="gates">${[0,1,2].map(()=>`<div class="gate closed" aria-hidden="true"><span class="gate-lbl">🔒</span></div>`).join("")}</div><p class="muted small" style="margin:0">Rond je 3 quests van vandaag af. Dan krijg je een routekaart en kun je zoveel extra routes lopen als je wilt.</p></section>`;

      h+=`<div class="counter"><div class="counter-row"><span class="count-num">${fmt(q.prog)} <small>/ ${fmt(q.target)}</small></span><button class="cbtn" data-act="gcnt" data-v="-${st[0]}" aria-label="min ${st[0]}">−</button><button class="cbtn" data-act="gcnt" data-v="${st[0]}">+${st[0]}</button><button class="cbtn" data-act="gcnt" data-v="${st[1]}">+${st[1]}</button></div><div class="bar cbar"><i style="width:${Math.min(100,q.prog/q.target*100)}%"></i></div></div>`;
      if(q.prog>=q.target)h+=`<button class="btn btn-done" data-act="gdone">Route voltooid</button>`;}

  }else{

      <div class="gates">${[0,1,2].map(i=>`<button class="gate" data-act="gopen" data-i="${i}" aria-label="Open routekaart ${i+1}"><span class="gate-core" style="animation-delay:-${i*1.7}s"></span><span class="gate-lbl">?</span></button>`).join("")}</div>

  o+=`<path d="M-22,-29 L-16,-33 L-12,-29 L-6,-34 L0,-29 L6,-34 L10,-30 L16,-32 L18,-28 L10,-26 L4,-29 L-2,-25 L-8,-29 L-14,-25 Z" fill="#fff" opacity="${stage>=5?.55:hc==="#eeeaf3"?.6:.28}"/>`;
  if(false)o+=`<path d="${HAIR[L.hair].front}" fill="${el.c2}" opacity=".25" filter="url(#${p}gl)"/>`;
  o+=`</g>`;
  // eindbaas-kroon
  if(stage>=5){
    if(E==="vuur")o+=`<path class="av-flick" d="M-24,-36 Q-30,-58 -18,-70 Q-15,-55 -9,-52 Q-10,-74 2,-88 Q5,-66 11,-60 Q15,-76 24,-78 Q17,-58 24,-36 Z" fill="${el.c}" stroke="${el.c2}" stroke-width="${f1(1.4/HS)}" opacity=".95"/><path d="M-12,-40 Q-10,-56 0,-68 Q4,-52 12,-40 Z" fill="${el.c2}" opacity=".8"/>`;
    if(E==="schaduw")o+=`<path d="M-20,-30 C-36,-48 -34,-68 -18,-82 C-24,-62 -18,-46 -9,-34 Z M20,-30 C36,-48 34,-68 18,-82 C24,-62 18,-46 9,-34 Z" fill="#1c0e2b" stroke="${OL}" stroke-width="${f1(2/HS)}"/><path d="M-24,-40 C-28,-54 -26,-66 -20,-74 M24,-40 C28,-54 26,-66 20,-74" stroke="${el.c}" stroke-width="${f1(1.4/HS)}" fill="none"/>`;
    if(E==="storm")o+=`<g class="av-spark"><path d="M-26,-36 L-36,-58 L-26,-56 L-38,-84 M26,-36 L36,-58 L26,-56 L38,-84 M0,-42 L-5,-64 L5,-62 L0,-90" stroke="${el.c2}" stroke-width="${f1(2.4/HS)}" fill="none" stroke-linejoin="miter"/></g>${fx?`<path d="M-26,-36 L-36,-58 L-26,-56 L-38,-84 M26,-36 L36,-58 L26,-56 L38,-84 M0,-42 L-5,-64 L5,-62 L0,-90" stroke="${el.c}" stroke-width="${f1(5/HS)}" fill="none" opacity=".6" filter="url(#${p}gl)"/>`:""}`;
    if(E==="vorst")o+=`<path d="M-20,-36 L-30,-68 L-12,-41 Z M-8,-40 L-6,-80 L4,-42 Z M8,-40 L18,-76 L14,-40 Z M20,-36 L32,-62 L14,-40 Z" fill="url(#${p}ice)" stroke="${el.c2}" stroke-width="${f1(1.4/HS)}"/>`;
    if(E==="natuur")o+=`<path d="M-16,-34 C-26,-50 -36,-56 -46,-72 M-31,-53 C-40,-53 -46,-49 -51,-51 M-40,-62 C-42,-70 -40,-76 -36,-80 M16,-34 C26,-50 36,-56 46,-72 M31,-53 C40,-53 46,-49 51,-51 M40,-62 C42,-70 40,-76 36,-80" stroke="#5a3b22" stroke-width="${f1(3.4/HS)}" fill="none" stroke-linecap="round"/>`+
      [[-46,-74,-30],[46,-74,30],[-51,-52,-80],[51,-52,80],[-36,-82,-10],[36,-82,10]].map(([x,y,a])=>`<path d="${SYM.natuur}" transform="translate(${x} ${y}) rotate(${a}) scale(5 6)" fill="${el.c}" stroke="${OL}" stroke-width=".2"/>`).join("");
  }
  o+=`</g></g></g>`; // hoofd, ink, body
  /* ---------- DEELTJES ---------- */
  if(fx&&stage>=1){const n=[0,3,4,6,9,14][stage];
    for(let i=0;i<n;i++){const x=cx-75+r()*150,y=140+r()*150,dl=f1(r()*3.4);
      if(E==="vuur")o+=`<circle class="av-rise" style="animation-delay:${dl}s" cx="${f1(x)}" cy="${f1(y)}" r="${f1(1+r()*2)}" fill="${r()<.5?el.c2:el.c}"/>`;
      else if(E==="storm")o+=`<path class="av-spark" style="animation-delay:${dl}s" d="M${f1(x)},${f1(y)} l3,-5 l-1,4 l3,-5" stroke="${el.c2}" stroke-width="1.2" fill="none"/>`;
      else if(E==="schaduw")o+=`<circle class="av-rise slow" style="animation-delay:${dl}s" cx="${f1(x)}" cy="${f1(y)}" r="${f1(2+r()*3)}" fill="${r()<.3?el.c2:el.c}" opacity=".7"/>`;
      else if(E==="vorst")o+=`<path class="av-rise slow" style="animation-delay:${dl}s" d="M${f1(x)},${f1(y-3)} L${f1(x)},${f1(y+3)} M${f1(x-2.6)},${f1(y-1.5)} L${f1(x+2.6)},${f1(y+1.5)} M${f1(x-2.6)},${f1(y+1.5)} L${f1(x+2.6)},${f1(y-1.5)}" stroke="#fff" stroke-width="1"/>`;
      else if(E==="alpen")o+=`<path class="av-rise slow" style="animation-delay:${dl}s" d="M${f1(x)},${f1(y-3)} L${f1(x)},${f1(y+3)} M${f1(x-2.6)},${f1(y-1.5)} L${f1(x+2.6)},${f1(y+1.5)} M${f1(x-2.6)},${f1(y+1.5)} L${f1(x+2.6)},${f1(y-1.5)}" stroke="#fff" stroke-width="1"/>`;
      else o+=`<circle class="av-rise slow" style="animation-delay:${dl}s" cx="${f1(x)}" cy="${f1(y)}" r="${f1(1+r()*1.6)}" fill="${el.c2}" opacity=".8"/>`;}}
  if(fx&&stage>=4&&E==="storm"){for(let i=0;i<(stage>=5?4:2);i++){const x=cx+(i%2?1:-1)*(60+r()*30),y=110+r()*90;o+=`<path class="av-spark" style="animation-delay:${f1(r()*1.5)}s" d="${bolt(x,y,60,r)}" stroke="${el.c2}" stroke-width="2" fill="none"/>`;}}
  if(false){for(let i=0;i<5;i++){const x=cx-95+r()*190,y=240+r()*50,s=4+r()*7;o+=`<path class="av-rise slow" style="animation-delay:${f1(r()*4)}s" d="M${f1(x)},${f1(y)} l${f1(s)},${f1(-s*0.6)} l${f1(s*0.7)},${f1(s*0.8)} l${f1(-s*1.2)},${f1(s*0.5)} Z" fill="#2b2533" stroke="${el.c}" stroke-width=".8"/>`;}}
  // charisma-vonken & bondgenoot-lichtjes
  if(fx){
    const sparks=Math.min(Math.floor(g("CHA")/3),14);
    for(let i=0;i<sparks;i++){const x=24+r()*192,y=40+r()*240,s=2+r()*3;o+=`<path class="av-spark" style="animation-delay:${f1(r()*2.4)}s" d="M${f1(x)} ${f1(y-s)} L${f1(x+s*.3)} ${f1(y-s*.3)} L${f1(x+s)} ${f1(y)} L${f1(x+s*.3)} ${f1(y+s*.3)} L${f1(x)} ${f1(y+s)} L${f1(x-s*.3)} ${f1(y+s*.3)} L${f1(x-s)} ${f1(y)} L${f1(x-s*.3)} ${f1(y-s*.3)} Z" fill="#ffd36a"/>`;}
    const calm=Math.min(Math.floor(g("RUS")/3),10);
    if(calm)o+=`<ellipse cx="${cx}" cy="${f1((headCY+ground)/2)}" rx="${80+calm*3}" ry="${f1((ground-headCY)/2+30)}" fill="none" stroke="${el.c2}" stroke-opacity="${(0.03+calm*0.01).toFixed(2)}" stroke-width="${8+calm}" filter="url(#${p}sm)"/>`;
    for(let i=0;i<calm;i++){const x=30+r()*180,y=70+r()*200;o+=`<circle class="av-bob" style="animation-delay:${f1(r()*3)}s" cx="${f1(x)}" cy="${f1(y)}" r="${f1(1.2+r()*1.4)}" fill="#ffffff" opacity=".7"/>`;}
    const orbs=Math.min(Math.floor(g("VER")/4),8);
    for(let i=0;i<orbs;i++){const side=i%2?1:-1,a=(-50+Math.floor(i/2)*33)*Math.PI/180,x=cx+side*Math.cos(a)*108,y=205+Math.sin(a)*90;
      o+=`<g class="av-bob" style="animation-delay:${(i*0.45).toFixed(2)}s"><circle cx="${f1(x)}" cy="${f1(y)}" r="7" fill="#4dffb8" opacity=".25" filter="url(#${p}gl)"/><circle cx="${f1(x)}" cy="${f1(y)}" r="2.8" fill="#c9ffe9"/></g>`;}
  }
  o+=`</g>`;
  if(sil)o+=`<text x="120" y="200" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="64" fill="${el.c}" opacity=".55">?</text>`;
  return o+`</svg>`;
}

/* ===================== RENDER ===================== */
function hud(){
  const ri=rankIdx(S.level),R=RANKS[ri],need=needXp(S.level),pct=Math.min(100,S.xp/need*100);
  const at=TITLES.find(t=>t.id===S.activeTitle);
  return `<section class="win hud" style="--rank:${R.col}">
   <div class="rank-badge"><span>${R.r}</span></div>
   <div class="hud-main">
    <div class="hud-top"><span class="hud-name">${esc(S.name)}</span><span class="hud-lvl">LV <b>${S.level}</b></span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${S.xp}"><i style="width:${pct}%"></i></div>
    <div class="hud-sub"><span>${fmt(S.xp)} / ${fmt(need)} XP · ${fmt(Math.round(S.totalXp*0.8))} m</span><span class="streak">${S.streak>0?"Streak "+S.streak+" · +"+Math.round((streakMult()-1)*100)+"% XP":at?esc(at.n):R.name}</span></div>
   </div></section>`;
}
function timeLeft(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.max(0,(m-n)/1000|0);return pad(s/3600|0)+":"+pad((s%3600)/60|0)+":"+pad(s%60);}
function qMeta(q){const st=STATS.find(s=>s.k===q.s);return `<div class="q-meta"><span class="q-cat">${CATLBL[q.cat]}</span><span class="q-stat">+${st.n}</span>${q.hidden?'<span class="hidden-tag">Verborgen pad</span>':""}<span class="q-xp">${q.xp} XP</span></div>`;}
function questsView(){
  const t=S.today;let h=hud();
  const P=S.penalty;
  if(P&&P.mode==="hard"&&P.date===S.today.date){
    if(!P.done){h+=`<section class="win notice stack"><span class="sys-label">Inhaaltocht</span>
      <p style="margin:0">Je hebt de dagelijkse quest niet voltooid.${P.lost?` Je streak van <b>${P.lost}</b> ${P.lost===1?"dag":"dagen"} is verbroken.`:""}${P.loss?` Je verliest <b>${P.loss} XP</b>.`:""}</p>
      <div class="q-text" style="color:var(--red)">${esc(P.quest)}</div>
      <p class="muted small" style="margin:0">Rond deze inhaaltocht vandaag af. Zolang hij openstaat, krijg je geen dagbonus.</p>
      <button class="btn danger" data-act="pendone">${P.confirm?"Tik nogmaals om te bevestigen":"Inhaaltocht voltooid"}</button></section>`;}
    else if(!P.ack){h+=`<section class="win stack"><span class="sys-label">Goed bezig</span><p style="margin:0">Ingehaald. Je bent terug op het pad.</p><button class="btn ghost" data-act="ackpen">Sluiten</button></section>`;}
  }else if(P&&P.mode!=="hard"&&!P.ack){h+=`<section class="win stack"><span class="sys-label">Rustdag</span><p style="margin:0">Je hebt een dag gemist. De strafmodus staat uit, dus je streak van <b>${P.lost}</b> blijft bevroren staan.</p><button class="btn ghost" data-act="ackpen">Verder</button></section>`;}
  const chosenMode=t.chosen.length===3;
  h+=`<div class="today-head"><div><span class="sys-label">Dagtocht</span><h2>${chosenMode?"Je quests van vandaag":"Kies 3 van de 7"}</h2></div><div class="timer">Reset over<b id="timer">${timeLeft()}</b></div></div>`;
  if(!chosenMode){
    h+=`<p class="muted small" style="margin:0">Vandaag liggen er zeven quests klaar. Kies er drie en rond ze vóór middernacht af.</p><div class="qlist">`;
    t.offer.forEach((q,i)=>{const sel=t.sel.includes(i);
      h+=`<button class="q${sel?" sel":""}${q.hidden?" hidden-q":""}" data-cat="${q.cat}" data-act="sel" data-i="${i}" aria-pressed="${sel}">${qMeta(q)}<div class="q-text">${esc(q.text)}</div>${q.h?`<div class="q-hint">${esc(q.h)}</div>`:""}<span class="q-check">${sel?"✓":""}</span></button>`;});
    h+=`</div><div class="choose-bar"><div class="row"><span>${t.sel.length} / 3 gekozen</span><span>${t.sel.reduce((a,i)=>a+t.offer[i].xp,0)} XP</span></div>
      <div class="actions"><button class="btn ghost" data-act="reroll" ${t.rerolled?"disabled":""}>${t.rerolled?"Al opnieuw getrokken":"Nieuwe 7 (1×)"}</button><button class="btn" data-act="accept" ${t.sel.length===3?"":"disabled"}>Accepteer</button></div></div>`;
  }else{
    if(t.perfect){h+=`<section class="win complete-banner"><span class="sys-label">Goed bezig</span><h2>Dagtocht voltooid</h2><p class="muted small" style="margin:0">Streak: ${S.streak} ${S.streak===1?"dag":"dagen"}. Je routekaart voor een extra route ligt klaar.</p></section>`;}
    h+=`<div class="qlist">`;
    t.chosen.forEach(i=>{const q=t.offer[i],d=!!t.done[i];
      h+=`<article class="q${d?" done":""}${q.hidden?" hidden-q":""}" data-cat="${q.cat}">${qMeta(q)}<div class="q-text">${esc(q.text)}</div>${q.h&&!d?`<div class="q-hint">${esc(q.h)}</div>`:""}`;
      if(d){h+=`<div class="sys-label" style="color:var(--ok)">✓ Voltooid</div>`;}
      else if(q.target){const p=t.prog[i]||0,st=q.step||(q.target>=40?[1,10]:[1,5]);
        h+=`<div class="counter"><div class="counter-row"><span class="count-num">${fmt(p)} <small>/ ${fmt(q.target)}</small></span>
          <button class="cbtn" data-act="cnt" data-i="${i}" data-v="-${st[0]}" aria-label="min ${st[0]}">−</button>
          <button class="cbtn" data-act="cnt" data-i="${i}" data-v="${st[0]}">+${st[0]}</button>
          <button class="cbtn" data-act="cnt" data-i="${i}" data-v="${st[1]}">+${st[1]}</button></div>
          <div class="bar cbar"><i style="width:${Math.min(100,p/q.target*100)}%"></i></div></div>`;
        if(p>=q.target)h+=`<button class="btn btn-done" data-act="done" data-i="${i}">Claim ${Math.round(q.xp*streakMult())} XP</button>`;}
      else{const cf=t.confirm===i;h+=`<button class="btn btn-done${cf?" gold":""}" data-act="done" data-i="${i}">${cf?"Tik nogmaals om te bevestigen":"Markeer als voltooid"}</button>`;}
      h+=`</article>`;});
    h+=`</div>`;
    h+=gatesView();
    if(!t.perfect){const left=t.chosen.filter(i=>!t.done[i]).length;h+=`<p class="muted small" style="margin:0;text-align:center">Nog ${left} te gaan. Rond alle drie af voor de dagbonus en je streak.</p>`;}
  }
  return h;
}
function hunterView(){

  let h=`<section class="win stack" style="--rank:${R.col}"><div class="avatar-wrap">${avatarSVG(S.look,ri,S.stats,{anim:true,label:R.name})}</div>
   <div class="avatar-caption">${at?`<span class="title-chip">« ${esc(at.n)} »</span>`:""}<h2>${esc(S.name)}</h2><span class="muted small">${R.name} · Level ${S.level}</span></div>
   <div class="evo" aria-label="Jouw evolutie">${RANKS.map((r,i)=>`<div class="evo-step${i===ri?" on":""}">${avatarSVG(S.look,i,null,{mini:true,sil:i>ri,label:r.name})}<span>${r.r}</span></div>`).join("")}</div>
   <button class="btn ghost" data-act="editlook">Uiterlijk aanpassen</button></section>`;

  h+=`</div><p class="muted small" style="margin:0">Elke voltooide quest geeft +1 in zijn stat. Per level krijg je 3 vrije punten om zelf te verdelen.</p></section>`;

  h+=`</ul></section>`;

  h+=`</div><p class="muted small" style="margin:0">Tik op een ontgrendelde titel om hem te dragen.</p></section>`;
  return h;
}
function logView(){

  h+=`<section class="win stack"><span class="sys-label">Per categorie</span><div class="kpis kpis-4">${["beweging","mindfulness","community","interactie"].map(c=>`<div class="kpi" style="border-color:var(--cat-${c})"><b>${S.counts[c]}</b><span>${CATLBL[c]}</span></div>`).join("")}</div></section>`;

  h+=`</section>`;
  const days=[["","Geen"],[1,"Ma"],[2,"Di"],[3,"Wo"],[4,"Do"],[5,"Vr"]];

   <div class="field"><label>Strafmodus</label>
    <button class="btn ${S.settings.penalty?"danger":"ghost"}" data-act="pmode" aria-pressed="${S.settings.penalty}">${S.settings.penalty?"Aan: gemiste dag = strafquest en XP-verlies":"Uit: gemiste dag bevriest je streak"}</button></div>
   <div class="field"><label>Kantoordag</label><div class="seg">${days.map(([v,l])=>`<button class="${String(S.settings.office??"")===String(v)?"on":""}" data-act="office" data-v="${v}">${l}</button>`).join("")}</div>
    <span class="muted small">Op deze dag krijg je altijd een kantoorquest aangeboden.</span></div>
   <div class="field"><label for="nm">Naam</label><input type="text" id="nm" maxlength="20" value="${esc(S.name)}"></div>
   <button class="btn ghost" data-act="name">Naam opslaan</button>
   <div class="field"><label for="bk">Back-upcode</label><textarea id="bk" placeholder="Plak hier een back-upcode om je voortgang terug te zetten"></textarea></div>
   <div class="actions"><button class="btn ghost" data-act="exp">Kopieer back-up</button><button class="btn ghost" data-act="imp">Herstel</button></div>
   <p class="muted small" style="margin:0">Op Android: open deze pagina in Chrome, tik op ⋮ en kies <b>App installeren</b> of <b>Toevoegen aan startscherm</b>.</p>
   <p class="muted small" style="margin:0" id="syncinfo">Je voortgang staat alleen op deze telefoon, niet in de cloud. Maak af en toe een back-up en bewaar de code in je notities.</p>
   <button class="btn danger" data-act="reset">${resetArm?"Tik nogmaals: alles wissen":"Begin opnieuw"}</button></section>`;

  let h=`<div><span class="sys-label">${firstLook?"Start":"Uiterlijk"}</span><h2>${firstLook?"Kies je bergloper":"Pas je bergloper aan"}</h2><p class="muted small" style="margin:4px 0 0">Je begint in het dal. Elke rang brengt je hoger en verandert je uitrusting, tot je bij S-rang op de top staat. Tik op een rang om de tocht te bekijken.</p></div>`;
  h+=`<section class="win stack" style="--rank:${R.col}"><div class="avatar-wrap">${avatarSVG(L,pStage,null,{anim:true,label:R.name})}</div>
    <p class="evo-label"><b style="color:${R.col}">${R.name}</b><br><span class="muted">${R.gear}</span></p>
    <div class="evo">${RANKS.map((r,i)=>`<button class="evo-step${i===pStage?" on":""}" data-act="pstage" data-v="${i}" aria-label="Bekijk ${r.name}">${avatarSVG(L,i,null,{mini:true,label:r.name})}<span>${r.r}</span></button>`).join("")}</div></section>`;
  h+=`<section class="win stack">`;
  h+=grp("Gebergte","element",LOOK_OPTS.element.map(e=>({v:e.k,label:e.n,sw:e.c})));
  h+=grp("Haarstijl","hair",LOOK_OPTS.hair.map(x=>({v:x.k,label:x.n})));
  h+=grp("Haarkleur","hairCol",LOOK_OPTS.hairCol.map((c,i)=>({v:i,sw:c})));
  h+=grp("Huidskleur","skin",LOOK_OPTS.skin.map((c,i)=>({v:i,sw:c})));
  h+=grp("Oogkleur","eyes",LOOK_OPTS.eyes.map((c,i)=>({v:i,sw:c})));
  h+=grp("Bril","bril",LOOK_OPTS.bril.map(x=>({v:x.k,label:x.n})));
  h+=grp("Outfit","outfit",LOOK_OPTS.outfit.map(x=>({v:x.k,label:x.n})));
  h+=grp("Outfitkleur","outCol",LOOK_OPTS.outCol.map((c,i)=>({v:i,sw:c})));
  h+=`<div class="field"><label for="cnm">Naam</label><input type="text" id="cnm" maxlength="20" value="${esc(S.name)}"></div>`;
  h+=`<div class="actions">${firstLook?"":`<button class="btn ghost" data-act="lookcancel">Annuleer</button>`}<button class="btn" data-act="lookok">${firstLook?"Start de tocht":"Opslaan"}</button></div></section>`;
  return h;
}
function openCreator(first){if(!first)pushBack();firstLook=!!first;draft=Object.assign({},DEFAULT_LOOK,S.look||{});pStage=first?0:rankIdx(S.level);tab="create";render();window.scrollTo(0,0);}
function render(){
  const app=$("#app");
  app.innerHTML=tab==="create"?createView():tab==="quests"?questsView():tab==="hunter"?hunterView():logView();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const t=S.today,open=t?(t.chosen.length<3?1:t.chosen.filter(i=>!t.done[i]).length||(t.gate&&t.gate.keys&&!t.gate.active?"!":0)):0;
  const bq=$("#badge-q");open?bq.setAttribute("data-n",open):bq.removeAttribute("data-n");
  const bh=$("#badge-h");S.free?bh.setAttribute("data-n",S.free):bh.removeAttribute("data-n");
}

/* ===================== OVERLAYS ===================== */
let showing=false;
function pushBack(){try{history.pushState({hs:1},"");}catch(e){}}
function flush(){
  if(showing||!queue.length)return;
  // Meerdere level-ups samenvoegen
  let e=queue.shift();
  while(e.type==="level"&&queue[0]&&queue[0].type==="level")e=queue.shift();
  showing=true;pushBack();let inner="";
  if(e.type==="level")inner=`<span class="sys-label">Goed bezig</span><div class="big">LEVEL ${e.level}</div><p style="margin:0">Je bent sterker geworden.<br><b style="color:var(--gold)">+3 vrije statpunten</b></p>`;
  if(e.type==="rank"){const R=RANKS[e.r];inner=`<span class="sys-label">Nieuwe hoogte</span><div class="big" style="color:${R.col};text-shadow:0 0 18px ${R.col}">${R.r}-RANG</div><p style="margin:0">Je bent een flink stuk hoger geklommen.<br>Nieuw ontgrendeld: <b>${R.gear}</b></p>`;}
  if(e.type==="daily")inner=`<span class="sys-label">Goed bezig</span><div class="big gold">DAGTOCHT VOLTOOID</div><p style="margin:0">Dagbonus <b style="color:var(--gold)">+${e.bonus} XP</b><br>Streak: ${S.streak} ${S.streak===1?"dag":"dagen"}<br><b style="color:var(--line)">Routekaart ontvangen</b></p>`;
  if(e.type==="gate"){const g=GATES[e.rar];inner=`<span class="sys-label">Extra route</span><div class="big" style="color:${g.c};text-shadow:0 0 18px ${g.c};font-size:34px">${g.n.toUpperCase()}</div><p style="margin:0">${g.d}</p>`;}
  if(e.type==="cleared"){const g=GATES[e.rar];inner=`<span class="sys-label">Goed bezig</span><div class="big" style="color:${g.c};text-shadow:0 0 18px ${g.c};font-size:32px">ROUTE VOLTOOID</div><p style="margin:0"><b style="color:var(--gold)">+${e.x} XP</b> · reeks ${e.combo}<br>Je krijgt een nieuwe routekaart.</p>`;}
  if(e.type==="title")inner=`<span class="sys-label">Titel verdiend</span><div class="big gold" style="font-size:30px">« ${esc(e.t.n)} »</div><p style="margin:0">${esc(e.t.d)}</p>`;
  $("#layer").innerHTML=`<div class="overlay" data-act="close"><div class="win">${inner}<button class="btn" data-act="close">OK</button></div></div>`;
}
let toastT;
function toast(msg){clearTimeout(toastT);let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;toastT=setTimeout(()=>el.remove(),2200);}

/* ===================== INTERACTIE ===================== */
document.addEventListener("click",ev=>{
  const tb=ev.target.closest(".tab");if(tb){if(firstLook&&!S.look){toast("Kies eerst je bergloper");return;}if(tab==="quests"&&tb.dataset.tab!=="quests")pushBack();tab=tb.dataset.tab;resetArm=false;render();window.scrollTo(0,0);return;}
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,t=S.today,i=+el.dataset.i;
  if(a==="close"){if(ev.target!==el&&el.classList.contains("overlay"))return;if(history.state&&history.state.hs){history.back();return;}$("#layer").innerHTML="";showing=false;flush();return;}
  if(a==="sel"){const p=t.sel.indexOf(i);if(p>-1)t.sel.splice(p,1);else if(t.sel.length<3)t.sel.push(i);else{toast("Je kunt er maar 3 kiezen");return;}save();render();return;}
  if(a==="reroll"){if(t.rerolled)return;t.offer=genOffer(t.date,1);t.sel=[];t.rerolled=true;save();render();toast("Zeven nieuwe quests liggen klaar");return;}
  if(a==="accept"){if(t.sel.length!==3)return;t.chosen=[...t.sel].sort((x,y)=>x-y);save();render();window.scrollTo(0,0);toast("Etappes gekozen. Goede tocht!");return;}
  if(a==="cnt"){const q=t.offer[i];t.prog[i]=Math.max(0,Math.min(q.target,(t.prog[i]||0)+(+el.dataset.v)));save();render();return;}
  if(a==="done"){const q=t.offer[i];if(!q.target&&t.confirm!==i){t.confirm=i;render();return;}t.confirm=null;complete(i);return;}
  if(a==="pt"){if(!S.free)return;S.free--;S.stats[el.dataset.k]++;save();render();return;}
  if(a==="title"){S.activeTitle=el.dataset.t;save();render();return;}
  if(a==="gopen"){openGate(i);return;}
  if(a==="gcnt"){const q=gateState().active;if(!q)return;q.prog=Math.max(0,Math.min(q.target,q.prog+(+el.dataset.v)));save();render();return;}
  if(a==="gdone"){const q=gateState().active;if(!q)return;if(!q.target&&!q.confirm){q.confirm=true;render();return;}clearGate();return;}
  if(a==="gquit"){abandonGate();return;}
  if(a==="look"){const k=el.dataset.k;draft[k]=NUMK.includes(k)?+el.dataset.v:el.dataset.v;render();return;}
  if(a==="pstage"){pStage=+el.dataset.v;render();return;}
  if(a==="editlook"){openCreator(false);return;}
  if(a==="lookcancel"){tab="hunter";render();return;}
  if(a==="lookok"){const v=($("#cnm").value||"").trim().slice(0,20);if(v)S.name=v;S.look=Object.assign({},draft);const f=firstLook;firstLook=false;save();tab=f?"quests":"hunter";render();window.scrollTo(0,0);toast(f?"Welkom op het pad, "+S.name:"Uiterlijk opgeslagen");return;}
  if(a==="ackpen"){S.penalty.ack=true;save();render();return;}
  if(a==="pendone"){const P=S.penalty;if(!P.confirm){P.confirm=true;render();return;}P.done=true;P.confirm=false;toast("Ingehaald");checkPerfect();checkTitles();save();render();flush();return;}
  if(a==="pmode"){S.settings.penalty=!S.settings.penalty;if(!S.settings.penalty&&S.penalty&&S.penalty.mode==="hard"&&!S.penalty.done){S.penalty.done=true;S.penalty.ack=true;checkPerfect();}save();render();toast(S.settings.penalty?"Strafmodus aan":"Strafmodus uit: je streak bevriest bij een gemiste dag");flush();return;}
  if(a==="office"){const v=el.dataset.v;S.settings.office=v===""?null:+v;if(t&&!t.chosen.length){t.offer=genOffer(t.date,t.rerolled?1:0);t.sel=[];}save();render();toast("Kantoordag opgeslagen");return;}
  if(a==="name"){const v=$("#nm").value.trim().slice(0,20);if(v){S.name=v;save();render();toast("Naam opgeslagen");}return;}
  if(a==="exp"){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$("#bk");ta.value=code;
    const done=()=>toast("Back-upcode gekopieerd");
    try{navigator.clipboard.writeText(code).then(done,()=>{ta.select();toast("Selecteer en kopieer de code hierboven");});}catch(e){ta.select();toast("Selecteer en kopieer de code hierboven");}return;}
  if(a==="imp"){try{const o=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));if(!o||!o.stats||!o.level)throw 0;adopt(o);ensureDay();save();render();toast("Voortgang hersteld");}catch(e){toast("Deze code klopt niet. Plak de volledige back-upcode.");}return;}
  if(a==="reset"){if(!resetArm){resetArm=true;render();return;}resetArm=false;S=fresh();ensureDay();save();tab="quests";render();toast("Nieuw begin");return;}
});

/* ===================== LOKALE OPSLAG ===================== */
// Alles blijft op dit toestel. Vraag het systeem de opslag niet op te ruimen.
async function initCloud(){try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}}

/* ===================== START ===================== */
function upgrade(){if(S.today&&S.today.perfect&&!S.today.gate)gateState().keys=1;if(S.poolV!==2){S.poolV=2;if(S.today&&!S.today.chosen.length){S.today.offer=genOffer(S.today.date,S.today.rerolled?1:0);S.today.sel=[];}}}
function adopt(o){S=migrate(Object.assign(fresh(),{poolV:1},o));upgrade();}
upgrade();ensureDay();save();render();if(!S.look)openCreator(true);
window.addEventListener("popstate",()=>{
  if(showing){$("#layer").innerHTML="";showing=false;flush();return;}
  if(tab==="create"&&!firstLook){tab="hunter";render();return;}
  if(tab!=="quests"&&tab!=="create"){tab="quests";resetArm=false;render();window.scrollTo(0,0);}
});
setInterval(()=>{const tm=$("#timer");if(tm)tm.textContent=timeLeft();if(ensureDay()){render();return;}const G=S.today&&S.today.gate,q=G&&G.active;if(q&&q.deadline){if(Date.now()>q.deadline)abandonGate("tijd");else{const gt=$("#gtimer");if(gt)gt.textContent=gateTimeLeft(q);}}},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ensureDay())render();});
initCloud();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
